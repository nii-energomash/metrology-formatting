# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Continuous Integration

on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
        description: 'Имя тега для сборки (например, v1.2.3), ветки или коммита. Если не указано, используется текущий ref'

jobs:
  run-ci:
    runs-on: ubuntu-latest
    container:
      image: node:20-bullseye

    steps:
      - name: 🛒 Checkout with param
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate checked-out ref
        run: |
          git rev-parse HEAD
          git status --porcelain

      - name: ✨ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Lint
        run: npm run lint

      - name: 🏗️ Build and cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ gitea.sha }}-${{ hashFiles('src/**', 'package.json') }}
          restore-keys: |
            build-

      - name: 🛠️ Build if cache missed
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: npm run build

      - name: 🧪 Run tests
        run: npm test
