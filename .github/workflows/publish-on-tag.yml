# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish NPM Package on New Tag

on:
  push:
    tags: ['v*.*.*']

jobs:
  ci:
    uses: './.github/workflows/ci.yml'
    with:
      ref: ${{ github.ref }}

  publish:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Extract version from tag
        id: get-version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 Версия из тега: ${VERSION}"

      - name: 📝 Update version in package.json
        run: |
          npm version ${{ steps.get-version.outputs.version }} --no-git-tag-version --allow-same-version
          echo "✅ Версия в package.json обновлена до ${{ steps.get-version.outputs.version }}"

      - name: 📥 Restore build from cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/
          key: build-${{ github.sha }}-${{ hashFiles('src/**', 'package.json') }}
          restore-keys: |
            build-

      - name: ✅ Verify build exists
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist/)" ]; then
            echo "❌ Каталог сборки пуст или отсутствует"
            exit 1
          fi
          echo "✅ Сборка найдена в dist/"

      - name: ✨ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@nii-energomash'

      - name: 🚀 Publish package to Github Registry
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
